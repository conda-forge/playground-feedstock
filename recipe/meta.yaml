{% set name = "playground" %}
{% set version = "1.0.0" %}
# The recent jax version required by this package require at least python 3.10
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/playground-{{ version }}.tar.gz
  sha256: b3c92a9a7ab235eac67d60b68349f860657fc94991e00a099ed496daaac6e74f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - etils
    - flax
    - jax
    - lxml
    - ml-collections
    - mujoco-mjx >=3.2.7
    - mujoco-python >=3.2.7
    - tqdm
    - brax >=0.12.1

test:
  imports:
    - mujoco_playground
  commands:
    - pip check
    - pytest --pyargs mujoco_playground
  requires:
    - pip
    - pytest
    - python {{ python_min }}
    - absl-py
    - dm-control
    - git

about:
  license: Apache-2.0
  license_file: LICENSE
  home: https://playground.mujoco.org/
  summary: "An open-source library for GPU-accelerated robot learning and sim-to-real transfer."

extra:
  recipe-maintainers:
    - traversaro
